server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Local/tunnel-only rehearsal. Enable trusted TLS/access ingress before hosting.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
    }
    location /health { proxy_pass http://api:4000; }
    location /uploads/ { proxy_pass http://api:4000; }
    location / { try_files $uri $uri/ /index.html; }
}
